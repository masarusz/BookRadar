<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookRadar 📡 — 図書館蔵書検索</title>
<meta name="description" content="Search Japanese public libraries for book availability, powered by Calil.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>📡</text></svg>">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.calil.jp https://www.googleapis.com; img-src 'self' data: https://books.google.com https://books.googleusercontent.com; base-uri 'none'; form-action 'none';">
<link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1>📡 BookRadar</h1>
    <p class="tagline">お近くの図書館で本を探そう</p>
    <button id="settingsBtn" class="icon-btn" title="設定" aria-label="設定">⚙️</button>
  </header>

  <main>
    <section class="search-section">
      <form id="searchForm" autocomplete="off">
        <input type="text" id="searchInput" placeholder="書名・著者名で検索" required>
        <button type="submit" id="searchSubmitBtn">検索</button>
        <button type="button" id="clearBtn" class="clear-btn" hidden>クリア</button>
      </form>
      <p id="currentCity" class="current-city"></p>
    </section>

    <section id="resultsSection" class="results-section" hidden>
      <h2>検索結果</h2>
      <ul id="resultsList" class="results-list"></ul>
    </section>

    <section id="availabilitySection" class="availability-section" hidden>
      <h2>蔵書状況</h2>
      <div id="availabilityBook" class="availability-book"></div>
      <div id="availabilityStatus" class="availability-status"></div>
      <ul id="availabilityList" class="availability-list"></ul>
    </section>

    <p id="message" class="message" hidden></p>
  </main>

  <footer class="app-footer">
    <p>図書館蔵書情報: <a href="https://calil.jp/" target="_blank" rel="noopener">カーリル</a> ／ 書誌情報: <a href="https://books.google.com/" target="_blank" rel="noopener">Google Books</a></p>
    <p id="appVersion" class="app-version"></p>
  </footer>

  <div id="settingsModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-content" tabindex="-1">
      <button id="closeSettingsBtn" class="icon-btn close-btn" aria-label="閉じる">✕</button>
      <h2 id="settingsTitle">設定</h2>

      <div class="settings-group">
        <label for="appkeyInput">カーリル API キー</label>
        <input type="password" autocomplete="off" id="appkeyInput" placeholder="calil.jp で取得したアプリケーションキー">
        <p class="hint"><a href="https://calil.jp/api/dashboard/" target="_blank" rel="noopener">calil.jp でキーを取得</a>（このキーはブラウザ内にのみ保存されます）</p>
        <div class="key-btn-row">
          <button id="saveKeyBtn">キーを保存</button>
          <button id="clearKeyBtn" type="button" class="clear-btn">削除</button>
        </div>
        <p id="appkeySavedMsg" class="save-confirm" hidden>✓ 保存しました</p>
      </div>

      <div class="settings-group">
        <label for="gbooksKeyInput">Google Books API キー（任意）</label>
        <input type="password" autocomplete="off" id="gbooksKeyInput" placeholder="キーなしでも動作しますが不安定な場合があります">
        <p class="hint">キーなしの検索は Google の共有割り当てを使うため、他の利用者の影響で失敗することがあります。<a href="https://console.cloud.google.com/apis/library/books.googleapis.com" target="_blank" rel="noopener">無料のキーを取得</a>すると安定します（ブラウザ内にのみ保存されます）。</p>
        <div class="key-btn-row">
          <button id="saveGbooksKeyBtn">キーを保存</button>
          <button id="clearGbooksKeyBtn" type="button" class="clear-btn">削除</button>
        </div>
        <p id="gbooksKeySavedMsg" class="save-confirm" hidden>✓ 保存しました</p>
      </div>

      <div class="settings-group">
        <label for="prefSelect">よく使う図書館（デフォルト）</label>
        <select id="prefSelect">
          <option value="">都道府県を選択</option>
        </select>
        <select id="citySelect" disabled>
          <option value="">市区町村を選択</option>
        </select>

        <div id="systemsList" class="systems-list"></div>

        <button id="saveDefaultBtn" disabled>この図書館をデフォルトに設定</button>
        <p id="defaultSavedMsg" class="save-confirm" hidden>✓ 保存しました</p>
        <p id="defaultSummary" class="hint"></p>
      </div>
    </div>
  </div>

</div>
<script src="script.js?v=1.3.0"></script>
</body>
</html>
